        <title id="rele-interruptores-title">Quarto PX: módulo relé e interruptores</title>
        <desc id="rele-interruptores-desc">O interruptor de baixa tensão envia um sinal digital ao módulo relé central, que também aceita comandos do hub por protocolo e chaveia a fase da rede elétrica para as lâmpadas convencionais.</desc>
