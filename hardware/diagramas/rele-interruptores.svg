      #rele-interruptores-root { font-family: var(--font-sans); color: var(--color-ink); }
      #rele-interruptores-root .diagram-container { width: 100%; overflow-x: auto; }
      #rele-interruptores-root .diagram-container { overflow-x: visible; }</style>
