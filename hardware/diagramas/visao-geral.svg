        <title id="visao-geral-title">Quarto PX: visão geral do hardware</title>
        <desc id="visao-geral-desc">Visão geral do quarto PX: a transportadora reserva no backend PX, que cria a senha na nuvem da fechadura e a envia ao app do motorista; no quarto, o hub de automação controla o ar-condicionado e o módulo relé, que liga as lâmpadas.</desc>
