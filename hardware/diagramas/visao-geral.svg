<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 648" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="visao-geral-title visao-geral-desc" id="visao-geral-root">
        <title id="visao-geral-title">Quarto PX: central do local e mesh Zigbee</title>
        <desc id="visao-geral-desc">Arquitetura do quarto PX: a Torre PX pré-reserva o quarto, pede a senha offline à API da fechadura (marca a definir) e a envia ao app; o motorista digita a senha na fechadura, que fica fora da rede Zigbee. A central do local fala com a Torre e, pelo coordenador Zigbee, com a mesh do quarto (relé de parede, sensor de porta, emissor infravermelho) e do banheiro (válvula do chuveiro). O assistente de voz é opcional, fase 2.</desc>
