      --color-ink:     #0F3D66;
      --color-muted:   #4B5563;
      --color-accent:  #1f6fbf;
      --font-sans:     'Nunito', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #visao-geral-root { font-family: var(--font-sans); color: var(--color-ink); }
      #visao-geral-root .diagram-container { width: 100%; overflow-x: auto; }
      #visao-geral-root .diagram-container { overflow-x: visible; }</style>
