        <title id="planta-quarto-title">Quarto PX: onde fica cada dispositivo</title>
        <desc id="planta-quarto-desc">Planta ilustrativa do quarto PX com cama, banheiro, fechadura na porta de entrada, interruptores na entrada e na cabeceira, ar-condicionado na parede e quadro com o módulo relé.</desc>
