<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 704" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="planta-quarto-title planta-quarto-desc" id="planta-quarto-root">
        <title id="planta-quarto-title">Quarto PX: 2 × 2,5 m</title>
        <desc id="planta-quarto-desc">Maquete do quarto PX com 2 por 2,5 metros: cama de solteiro, janela com ar-condicionado em cima na parede dos fundos, porta com fechadura na parede oposta, cômoda com o assistente de voz, interruptor ao lado da porta e detector de fumaça no centro do teto.</desc>
